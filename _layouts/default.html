<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cloudflare.com"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ "/" | relative_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
        
        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="Logo" />
        {% endif %}

        <p>{{ site.description | default: site.github.project_tagline }}</p>
        <!-- THÊM THANH ĐIỀU HƯỚNG TẠI ĐÂY -->
        <nav style="margin-top: 20px;">
        <a href="{{ "/" | relative_url }}" style="font-weight: bold; margin-right: 15px;">Home</a>
        <a href="{{ "/archive/" | relative_url }}" style="font-weight: bold;">Archive</a>
        </nav>

      </header>
      
      <section>
        {{ content }}
      </section>
      
      <footer>
        <!-- KHU VỰC CHỈNH SỬA FOOTNOTE CỦA BẠN -->
        <p>© 2026 {{ site.title }}. </p>
        <p>
          <a href="https://www.flickr.com/photos/fridaycafe/" target="_blank">Flickr</a> | 
          <a href="http://fridaycafe.blogspot.com/" target="_blank">Blogger</a> |
          <a href="{{ site.github.owner_url }}">GitHub</a>
        </p>
        <!-- HẾT KHU VỰC CHỈNH SỬA -->
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
